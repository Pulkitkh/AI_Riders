# TLS reverse proxy for PRAHARI — put this in front of the sensor bound to
# 127.0.0.1:8000 so the public link is HTTPS and the SSE stream survives.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/prahari
#   sudo ln -s /etc/nginx/sites-available/prahari /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d prahari.example.org   # free Let's Encrypt cert
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Server-Sent-Events stream is the part that needs care: proxy buffering
# MUST be off or alerts arrive in delayed clumps instead of the moment they are
# raised. The three directives under /api/live/stream are what make real-time
# real through a proxy.
server {
    listen 80;
    server_name prahari.example.org;      # <-- your domain
    # certbot rewrites this block to add listen 443 ssl and the certificate.

    # the read-only viewer + stateless API + live control
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the live event stream — buffering off, long read timeout, keep-alive
    location /api/live/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;              # deliver each event immediately
        proxy_cache off;
        proxy_read_timeout 3600s;         # a stream stays open
        chunked_transfer_encoding off;
    }

    # uploaded captures can be a few MB
    client_max_body_size 8m;
}
